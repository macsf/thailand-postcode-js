version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/demo"]
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    # Majors are handled manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    groups:
      # Security fixes (any time) land in one PR
      security:
        applies-to: security-updates
        patterns: ["*"]
      # All routine minor/patch updates land in one PR
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Bangkok
    groups:
      actions:
        patterns: ["*"]
